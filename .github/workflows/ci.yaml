name: CI práctica Nginx

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Validar HTML y placeholders
        run: | 
          test -f index.html
          if ! grep -qi '<!doctype html>' index.html; then
            echo "Falta el doctype HTML"
            exit 1
          fi
          if grep -Fq '{{' index.html; then
            echo "Queda al menos un placeholder {{...}} sin reemplazar"
            exit 1
          fi
      - name: Verificar Dockerfile
        run: test -f Dockerfile
      - name: Comprobar que la imagen se construye
        run: docker build -t practica-nginx .