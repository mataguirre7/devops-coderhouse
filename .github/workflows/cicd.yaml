name: CI/CD Proyecto Final

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write
  security-events: read

jobs:
  # 1) Build y test de la aplicacion
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Validar HTML
        run: |
          test -f index.html
          grep -qi '<!doctype html>' index.html || (echo "Falta el doctype" && exit 1)

      - name: Lint del Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Construir imagen Docker
        run: docker build -t app:ci .

      - name: Test de humo (la pagina responde)
        run: |
          docker run -d --name app -p 8080:8080 app:ci
          sleep 3
          curl -sf http://localhost:8080/healthz
          curl -sf http://localhost:8080/ | grep -qi "Nginx"
          docker rm -f app

  # 2) Analisis de seguridad SAST (escaneo de codigo e imagen)
  sast:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t app:scan .

      - name: Trivy - escaneo de imagen (SAST)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: app:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0" # no frenar el pipeline en la entrega, solo reportar

  # 3) Build y push de la imagen al registry (solo en main)
  build-push:
    runs-on: ubuntu-latest
    needs: [build-test, sast]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        run: |
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

  # 4) Analisis de seguridad DAST (app corriendo) con OWASP ZAP
  dast:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Levantar la app
        run: |
          docker build -t app:dast .
          docker run -d --name app -p 8080:8080 app:dast
          sleep 3

      - name: OWASP ZAP Baseline (DAST)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:8080
          fail_action: false # solo reportar, no frenar la entrega

  # 5) Despliegue en Kubernetes (cluster local con kind, como prueba)
  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Crear cluster kind
        uses: helm/kind-action@v1.10.0
        with:
          config: k8s/kind-config.yaml

      - name: Aplicar manifiestos
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl rollout status deployment/nginx-app -n nginx-app --timeout=120s
          kubectl get pods -n nginx-app
